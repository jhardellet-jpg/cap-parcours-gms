<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>CAP PARCOURS GMS® | V6 · Segmentation TPE</title><style>
:root{--navy:#13374e;--navy2:#1d4d62;--teal:#147d87;--gold:#c9933a;--ink:#1c3542;--muted:#5d7380;--line:#d9e5e8;--bg:#f2f6f7;--green:#24745f}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:Arial,'Segoe UI',sans-serif;line-height:1.52;color:var(--ink)}button,input,select{font:inherit}button{cursor:pointer}button:disabled{opacity:.45;cursor:default}header{background:var(--navy);color:#fff;padding:17px max(22px,calc((100vw - 1200px)/2));display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{font-size:19px;letter-spacing:.025em;font-weight:800}.sub{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:#bad4de}.badge{border:1px solid #67899b;padding:5px 10px;border-radius:18px;font-size:12px;color:#e5eef2}.wrap{max-width:1200px;margin:0 auto;padding:25px 20px}.stage{display:flex;gap:7px;margin-bottom:15px}.stage div{flex:1;height:7px;border-radius:6px;background:#d5e0e3}.stage div.on{background:var(--teal)}.layout{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:18px}.main,.aside{background:#fff;border:1px solid var(--line);border-radius:17px;box-shadow:0 6px 22px #12364a0a}.main{padding:31px 35px;min-height:590px}.aside{padding:21px;align-self:start;position:sticky;top:16px}.eyebrow{font-size:11px;letter-spacing:.13em;color:var(--teal);font-weight:800;text-transform:uppercase}h1{color:var(--navy);font-size:clamp(28px,3.6vw,40px);line-height:1.15;margin:11px 0 14px}h2{color:var(--navy);font-size:26px;line-height:1.2;margin:8px 0 17px}h3{color:var(--navy);font-size:18px;margin:0 0 10px}p{margin:0 0 13px}.lead{font-size:18px;color:#465e6c}.muted{color:var(--muted)}.small{font-size:13px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:18px 0}.field{display:flex;flex-direction:column;gap:5px}.field label{font-weight:700;color:var(--navy);font-size:13px}.field input,.field select{padding:12px;border:1px solid #b9cbd1;border-radius:9px;background:white;color:var(--ink);width:100%;min-width:0}.field input:focus,.field select:focus{outline:2px solid var(--teal)}.box{border:1px solid var(--line);border-radius:12px;padding:18px;margin:17px 0;background:#fff}.shade{background:#f3f8f8}.info{background:#eaf5f4;border-left:4px solid var(--teal);border-radius:7px;padding:15px 18px;margin:17px 0}.warn{border-left-color:var(--gold);background:#fff8ed}.actions{display:flex;justify-content:space-between;gap:10px;margin-top:23px;border-top:1px solid var(--line);padding-top:20px;flex-wrap:wrap}.btn{background:var(--navy);border:1px solid var(--navy);color:white;font-weight:750;padding:11px 17px;border-radius:9px}.btn:hover{background:var(--navy2)}.btn.secondary{background:white;color:var(--navy)}.btn.gold{background:var(--gold);border-color:var(--gold);color:#152e3c}.options{display:grid;gap:11px;margin:18px 0}.option{width:100%;text-align:left;display:flex;align-items:center;gap:14px;padding:16px;background:#fff;border:2px solid var(--line);border-radius:11px;color:var(--ink)}.option:hover{border-color:#84b3b8}.option.selected{background:#eaf5f5;border-color:var(--teal)}.letter{font-weight:800;background:#edf2f3;border-radius:50%;min-width:32px;height:32px;display:grid;place-items:center}.option.selected .letter{background:var(--teal);color:#fff}.choiceGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:22px 0}.routeCard{border:2px solid var(--line);border-radius:14px;padding:18px;text-align:left;background:#fff;display:flex;flex-direction:column;gap:9px;min-height:185px;color:var(--ink)}.routeCard.selected{border-color:var(--teal);background:#eaf5f5}.routeCard strong{font-size:19px;color:var(--navy)}.routeCard span{font-size:13px;color:var(--muted)}.sideRow{display:flex;justify-content:space-between;gap:9px;border-bottom:1px solid #e6eef0;padding:10px 0;font-size:13px}.sideRow b{text-align:right}.sideRow:last-child{border-bottom:0}.sideTitle{font-weight:800;color:var(--navy);margin-bottom:10px}.tag{font-size:12px;border-radius:18px;padding:5px 9px;background:#eaf4f3;color:#1b7176;display:inline-block;font-weight:700} .verdict{border:1px solid #cedfe4;border-left:6px solid #647e8b;border-radius:12px;padding:17px 19px;margin:14px 0;background:#f6f9fb}.verdict.positive{border-left-color:#238567;background:#eff8f4}.verdict.neutral{border-left-color:#c18a36;background:#fffaf0}.verdict.negative{border-left-color:#c45b46;background:#fff4f0}.verdictTop{display:flex;align-items:center;gap:9px;font-weight:800;font-size:16px;margin-bottom:9px}.verdict p{margin:4px 0 8px}.why{font-size:13px;margin-top:8px}.why li{margin:4px 0}.meta{font-size:12px;color:#566f7a;padding-top:9px;border-top:1px solid #dbe7e9;margin-top:9px}.pill{border-radius:22px;padding:4px 9px;font-size:12px;font-weight:800;white-space:nowrap}.pill.positive{color:#17634f;background:#e0f3eb}.pill.neutral{color:#895d16;background:#fff0d4}.pill.negative{color:#963a2c;background:#ffe4dd}.reveal{border:1px solid var(--line);padding:20px;border-radius:13px;margin:18px 0}.triad{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-top:16px}.triad>div{padding:15px;border-radius:10px;background:#f2f7f8}.triad .full{grid-column:1/-1;border-left:4px solid var(--gold)}.triad strong{display:block;color:var(--navy);margin-bottom:5px}.learn{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin:16px 0}.learn>div{padding:15px;background:#f6f8f9;border:1px solid var(--line);border-radius:10px;font-size:13px}.learn b{display:block;color:var(--teal);margin-bottom:4px}.list{padding-left:19px}.list li{margin:8px 0}.mini-table{width:100%;border-collapse:collapse;font-size:13px}.mini-table td,.mini-table th{padding:10px;text-align:left;border-bottom:1px solid var(--line);vertical-align:top}.mini-table th{background:#e9f1f3}.inset{padding:12px;border:1px dashed #b1c8ce;background:#f8fafb;border-radius:9px;margin-top:14px}.foot{text-align:center;color:var(--muted);font-size:12px;margin-top:16px}.smalllink{background:none;border:0;padding:0;color:var(--teal);font-weight:700;text-decoration:underline}.check{display:flex;gap:10px;align-items:flex-start;margin:10px 0}.check input{accent-color:var(--teal);margin-top:5px}.sidebutton{margin-top:15px;width:100%}@media(max-width:850px){.layout{grid-template-columns:1fr}.aside{position:static}.main{padding:24px}.choiceGrid{grid-template-columns:1fr}.formgrid{grid-template-columns:1fr}}@media(max-width:540px){header{flex-direction:column;align-items:flex-start}.triad,.learn{grid-template-columns:1fr}.triad .full{grid-column:auto}.wrap{padding:12px}.main{padding:19px}}@media print{header,.aside,.actions,.stage,.foot,.screenOnly{display:none!important}.wrap{padding:0}.layout{display:block}.main{padding:12px;border:0;box-shadow:none;min-height:0}.reveal{break-inside:avoid}body{background:white}}
</style></head><body><header><div><div class="brand">CAP NEGO® <span style="color:#e4bb74">/</span> CAP PARCOURS GMS®</div><div class="sub">AREA Île-de-France · Simulateur de référencement</div></div><div class="badge">V6 · Segmentation TPE</div></header><div class="wrap"><div id="progress" class="stage"></div><div class="layout"><main class="main" id="main" aria-live="polite"></main><aside class="aside" id="aside"></aside></div><div class="foot">Simulation pédagogique · Les situations ne remplacent pas l'analyse contractuelle, réglementaire et économique propre à chaque entreprise.</div></div><script>
'use strict';
const choices={revenue:[['0-50','0 à 50 k€'],['50-100','50 à 100 k€'],['100-150','100 à 150 k€'],['150-200','150 à 200 k€'],['200-250','200 à 250 k€'],['250-300','250 à 300 k€'],['300-400','300 à 400 k€'],['400-500','400 à 500 k€'],['500-750','500 à 750 k€'],['750-1000','750 k€ à 1 M€'],['1000+','Plus de 1 M€']],share:[['0','0 %'],['0-5','Plus de 0 à 5 %'],['5-10','Plus de 5 à 10 %'],['10-15','Plus de 10 à 15 %'],['15-20','Plus de 15 à 20 %'],['20-25','Plus de 20 à 25 %'],['25-30','Plus de 25 à 30 %'],['30-35','Plus de 30 à 35 %'],['35-40','Plus de 35 à 40 %'],['40-45','Plus de 40 à 45 %'],['45-50','Plus de 45 à 50 %'],['50-55','Plus de 50 à 55 %'],['55-60','Plus de 55 à 60 %'],['60-65','Plus de 60 à 65 %'],['65-70','Plus de 65 à 70 %'],['70-75','Plus de 70 à 75 %'],['75-80','Plus de 75 à 80 %'],['80-85','Plus de 80 à 85 %'],['85-90','Plus de 85 à 90 %'],['90-95','Plus de 90 à 95 %'],['95-100','Plus de 95 à 100 %']],category:[['sale','Épicerie salée'],['sweet','Épicerie sucrée'],['brsa','Boissons sans alcool'],['wine','Vins et spiritueux'],['fresh','Produits frais'],['frozen','Surgelés'],['other','Autre catégorie']],presence:[['none','Aucun référencement GMS'],['stores','Quelques magasins'],['regional','Référencement régional'],['national','Référencement national']],logistics:[['direct','Livraison directe par l’entreprise'],['carrier','Transporteur externe'],['provider','Prestataire logistique'],['platform','Livraison sur plateforme']],cgv:[['none','Non formalisés'],['partial','Partiellement structurés'],['ready','Formalisation maîtrisée']],economics:[['no','Non, pas encore'],['partial','Partiellement'],['yes','Oui, par client ou circuit']],type:[['independent','Groupement d’indépendants'],['integrated','Enseigne intégrée'],['mixed','Organisation mixte / à préciser']]};
const ROUTES={local:{name:'LOCAL',tag:'Tester et démontrer',opportunity:'Accès direct à un décideur, test des rotations, ajustement rapide de l’offre.',attention:'Coût commercial et coût de livraison rapportés à des volumes souvent limités.',preco:'Définir un test ciblé, des CGV et conditions négociées maîtrisées, puis organiser le suivi du magasin.',docs:['Fiche article, GTIN et informations réglementaires','Tarif et CGV applicables, CPV ou remises négociées le cas échéant','Organisation des commandes, livraisons et factures','Suivi de disponibilité et des rotations']},regional:{name:'RÉGIONAL',tag:'Mutualiser et développer',opportunity:'Une plateforme peut approvisionner plusieurs magasins avec une livraison fournisseur centralisée.',attention:'Accès à la plateforme ≠ commandes de tous les magasins. Préconisation, commande libre et distribution poussée diffèrent.',preco:'Vérifier le parc réellement ciblé, le mode de diffusion, les données articles et les exigences de livraison plateforme.',docs:['Tous les fondamentaux du local','Processus de publication des données produit selon l’enseigne','EDI ou modalités alternatives acceptées par le distributeur','Logistique plateforme, palettes, transport, créneaux et taux de service','Plan d’activation des magasins ciblés']},national:{name:'NATIONAL',tag:'Déployer et piloter',opportunity:'Diffusion potentiellement plus large, visibilité de marque et perspectives de volumes.',attention:'Capacité industrielle, couverture logistique, engagements commerciaux, budget de lancement et force de vente.',preco:'Établir un plan de déploiement réaliste et une rentabilité globale, avec moyens commerciaux et logistiques dédiés.',docs:['Tous les fondamentaux du local et du régional selon le schéma de distribution','Prévisions de volumes et de capacités','Couverture des sites logistiques et dispositif de service','Plan de déploiement, promotion, animation et pilotage','Négociation structurée des accords et contreparties']}};
const state={view:'profile',profile:{name:'Les Biscuits de nos Régions',revenue:'750-1000',share:'0',category:'sweet',presence:'none',logistics:'direct',cgv:'partial',economics:'partial',type:'independent'},route:null,step:0,selected:null,revealed:false,history:[],checks:{}};
const $=id=>document.getElementById(id);const esc=t=>String(t??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const label=(k,v)=>choices[k]?.find(x=>x[0]===v)?.[1]||v;
const field=(k,l)=>`<div class="field"><label for="${k}">${l}</label><select id="${k}" onchange="updateField('${k}',this.value)">${choices[k].map(([v,t])=>`<option value="${v}" ${state.profile[k]===v?'selected':''}>${esc(t)}</option>`).join('')}</select></div>`;
function updateField(k,v){state.profile[k]=v;renderAside();}function updateName(v){state.profile.name=v;renderAside();}
function progress(){const index={profile:0,route:1,journey:2,summary:3}[state.view];$('progress').innerHTML=[0,1,2,3].map(i=>`<div class="${i<=index?'on':''}"></div>`).join('');}
function renderAside(){const p=state.profile;const r=state.route;const headings={profile:'Fiche entreprise',route:'Votre entreprise',journey:'Dossier du parcours',summary:'Bilan du parcours'};let h=`<div class="sideTitle">${headings[state.view]}</div><div class="sideRow"><span>Entreprise</span><b>${esc(p.name||'À renseigner')}</b></div><div class="sideRow"><span>CA annuel</span><b>${esc(label('revenue',p.revenue))}</b></div><div class="sideRow"><span>Part GMS</span><b>${esc(label('share',p.share))}</b></div><div class="sideRow"><span>Activité</span><b>${esc(label('category',p.category))}</b></div><div class="sideRow"><span>Situation actuelle</span><b>${esc(label('presence',p.presence))}</b></div>${r?`<div class="sideRow"><span>Circuit exploré</span><b>${ROUTES[r].name}</b></div>`:''}`;if(state.view==='journey')h+=`<div class="inset"><b>${state.step+1} / ${scenes().length}</b> situations · <span class="muted">ENTRER → CONVAINCRE → DURER</span></div>`;if(state.view!=='profile')h+=`<button class="btn secondary sidebutton" onclick="goProfile()">Modifier la fiche</button>`;$('aside').innerHTML=h;}
function profileView(){const p=state.profile;return `<div class="eyebrow">ÉTAPE 1 / 4 · MON ENTREPRISE</div><h1>Présentons votre entreprise</h1><p class="lead">Quelques caractéristiques pour construire le scénario. Pas de tarif unitaire, de coût de revient ni de données confidentielles à fournir.</p><div class="box shade"><div class="field"><label for="company">Nom de l’entreprise fictive ou réelle</label><input id="company" maxlength="95" value="${esc(p.name)}" oninput="updateName(this.value)" placeholder="Nom de l’entreprise"></div><div class="formgrid">${field('revenue','Chiffre d’affaires annuel (tranches TPE)')}${field('share','Part du CA en GMS (pas de 5 %)')}${field('category','Famille de produits')}${field('presence','Expérience actuelle en GMS')}${field('logistics','Organisation logistique actuelle')}${field('cgv','Tarifs et CGV')}${field('economics','Rentabilité par client / circuit maîtrisée ?')}${field('type','Type d’enseigne envisagé')}</div></div><div class="info">Le parcours utilise ces informations pour faire apparaître les points de vigilance adaptés. Elles ne constituent pas un score CAP SCORE GMS®.</div><div class="actions"><span class="muted small">Étape suivante : choisir librement le circuit à explorer.</span><button class="btn gold" onclick="goRoute()">Choisir mon circuit →</button></div>`;}
function routeView(){return `<div class="eyebrow">ÉTAPE 2 / 4 · MON AMBITION</div><h1>Quel circuit souhaitez-vous explorer ?</h1><p class="lead">Vous choisissez l’objectif commercial. Le simulateur vous fera découvrir les opportunités et les exigences du circuit, sans imposer une orientation.</p><div class="choiceGrid">${Object.entries(ROUTES).map(([k,r])=>`<button class="routeCard ${state.route===k?'selected':''}" onclick="setRoute('${k}')" aria-pressed="${state.route===k}"><strong>${r.name}</strong><span>${r.tag}</span><span>${k==='local'?'Des ventes dans quelques magasins':k==='regional'?'Un accès à la plateforme et à un périmètre régional':'Une diffusion à plus grande échelle'}</span></button>`).join('')}</div>${state.route?`<div class="box shade"><h3>Le regard CAP NEGO® — ${ROUTES[state.route].name}</h3><p><b>Opportunité :</b> ${ROUTES[state.route].opportunity}</p><p><b>Point d’attention :</b> ${ROUTES[state.route].attention}</p></div>`:''}<div class="actions"><button class="btn secondary" onclick="goProfile()">← Fiche entreprise</button><button class="btn gold" onclick="startJourney()" ${state.route?'':'disabled'}>Lancer le parcours →</button></div>`;}
function sceneData(){const r=state.route,p=state.profile,n=esc(p.name||'Cette entreprise');const type=label('type',p.type);return [
{stage:'ENTRER',title:'Une opportunité commerciale se présente',story:`${n} souhaite développer sa présence en ${ROUTES[r].name.toLowerCase()}. Une enseigne (${esc(type)}) accepte d’étudier son offre. Avant d’envoyer le dossier, une première décision s’impose.`,question:'Quelle première démarche donne le plus de valeur au rendez-vous ?',opts:[{t:'Présenter une gamme complète et demander un référencement rapide.',effect:'Une présentation complète peut intéresser l’acheteur, mais le rôle de chaque référence dans son assortiment reste à démontrer.'},{t:'Analyser les rayons cibles, les prix, la concurrence et le rôle attendu des produits.',effect:'Cette approche permet de bâtir une proposition argumentée. Il faut aussi préparer les documents et conditions nécessaires.'},{t:'Proposer un test commercial limité avec objectifs de suivi et dossier fournisseur complet.',effect:'Un test cadré limite l’exposition et donne des éléments mesurables, à condition d’adapter le dispositif au circuit.'}],opportunity:ROUTES[r].opportunity,attention:ROUTES[r].attention,preco:'Relier l’offre à un besoin réel de l’assortiment puis cadrer la proposition et son périmètre.',score:'Attractivité de l’offre · Crédibilité fournisseur',passport:'ENTRER — Légitimité : preuve de différenciation, informations produit, interlocuteur ciblé.'},
{stage:'ENTRER',title:r==='local'?'Le magasin veut créer les articles':r==='regional'?'La centrale ouvre l’accès à sa plateforme':'L’enseigne prépare son déploiement',story:r==='local'?'Le directeur de magasin demande les fiches produits, le tarif et les conditions commerciales pour créer les articles. Les commandes pourront être transmises directement.':r==='regional'?'La centrale régionale dessert plusieurs magasins. Elle demande une création d’articles et précise les modalités d’échanges de données, de commande et de livraison sur plateforme.':'Le référencement envisagé concerne plusieurs zones. L’enseigne transmet son processus de données produit, ses modalités d’échange et son cahier des charges logistique.',question:'Comment sécuriser le dossier et le démarrage ?',opts:r==='local'?[{t:'Présenter les données article, GTIN, tarifs, CGV et modalités de commande/livraison.',effect:'Le magasin dispose des éléments nécessaires au référencement dans son processus local, sous réserve de ses exigences propres.'},{t:'Souscrire immédiatement Salsify et une solution EDI.',effect:'Ces investissements ne sont pas une obligation générale dans ce scénario de vente directe. Il faut d’abord vérifier les besoins du magasin.'},{t:'Lancer les ventes, puis formaliser les documents au fil des commandes.',effect:'Le manque de formalisation peut créer des erreurs tarifaires, des litiges et des difficultés de réassort.'}]:[{t:'Valider les formats et flux réellement exigés : données, commandes, expéditions, factures.',effect:'Le bon point de départ est le cahier des charges : Salsify, AGENA3000, EDI ou solutions alternatives ne sont à choisir qu’en fonction des exigences réelles.'},{t:'Choisir un prestataire EDI et PIM avant d’avoir reçu les spécifications.',effect:'L’entreprise risque de financer des fonctionnalités inutiles ou incompatibles avec les exigences de l’enseigne.'},{t:'Se concentrer uniquement sur le tarif en laissant le prestataire gérer le reste.',effect:'L’externalisation facilite l’exécution, mais le fournisseur demeure responsable de la qualité des données et de ses engagements.'}],opportunity:r==='local'?'Une mise en place rapide avec des outils proportionnés.':ROUTES[r].opportunity,attention:r==='local'?'Un référencement local requiert malgré tout des données fiables et des conditions formalisées.':'Exigences de transmission, codification logistique et opérations de réception à vérifier avant l’engagement.',preco:r==='local'?'Ne pas suréquiper le fournisseur ; fiabiliser le dossier et la procédure de commande.':'Partir des spécifications de l’enseigne ; sélectionner ensuite des outils et partenaires compatibles.',score:'Crédibilité fournisseur · Maîtrise économique',passport:'ENTRER — Pièces de référencement, CGV et organisation des échanges.'},
{stage:'CONVAINCRE',title:'L’acheteur souhaite négocier',story:`Le responsable commercial apprécie l’offre de ${n}, mais demande des conditions supplémentaires. Les CGV, le barème et les modalités de l’accord constituent le point de départ de la discussion.`,question:'Quelle démarche adopter avant d’accepter les conditions demandées ?',opts:[{t:'Accepter la remise en échange d’une promesse de développement.',effect:'Une promesse sans périmètre, volumes ni contreparties vérifiables peut dégrader l’économie de l’accord.'},{t:'Reconstituer la descente tarifaire : CGV, CPV, remises et coopération, avec leurs assiettes.',effect:'La construction des conditions économiques est maîtrisée. Il reste à vérifier volumes, contreparties et coûts associés.'},{t:'Demander un engagement sur le déploiement et chiffrer l’accord avant toute concession.',effect:'Cette démarche traite les contreparties et la rentabilité. Elle doit s’appuyer sur une descente tarifaire structurée.'}],opportunity:'Négocier des engagements réciproques et une croissance maîtrisée.',attention:'Toutes les réductions et rémunérations ne se calculent pas sur une même assiette ; les coûts commerciaux et logistiques comptent.',preco:'Chiffrer l’économie globale, formaliser les contreparties et vérifier le cadre applicable.',score:'Maîtrise économique · Influence & négociation',passport:'CONVAINCRE — Préparer le tarif, les CGV, les objectifs et les concessions.'},
{stage:'DURER',title:r==='local'?'La première livraison en magasin':r==='regional'?'La première livraison plateforme':'Le lancement multi-régions',story:r==='local'?'Une commande est passée. Le magasin souhaite un réassort rapide, mais les frais de transport absorbent une part importante de la contribution de l’opération.':r==='regional'?'La plateforme dessert 200 magasins, mais la préconisation porte sur 80 points de vente seulement. Selon l’enseigne, les magasins peuvent commander librement ou recevoir une mise en place poussée.':'La centrale confirme un périmètre de lancement. Certaines catégories de magasins sont ciblées ; le déploiement demande une coordination des stocks, des implantations et des équipes commerciales.',question:r==='local'?'Quelle organisation commerciale et logistique privilégier ?':r==='regional'?'Quel indicateur doit guider le prévisionnel de lancement ?':'Quel doit être le pilotage du déploiement ?',opts:r==='local'?[{t:'Livrer chaque commande immédiatement sans réexaminer son coût.',effect:'Le service rendu est réel, mais une fréquence non maîtrisée peut rendre la relation structurellement déficitaire.'},{t:'Négocier une fréquence ou un minimum de commande compatible avec le magasin.',effect:'L’optimisation des tournées et des conditions de commande peut concilier disponibilité et rentabilité, si elle est acceptée.'},{t:'Attendre une accumulation de commandes sans convenir de délai.',effect:'Le magasin risque des ruptures et la confiance commerciale peut se dégrader.'}]:r==='regional'?[{t:'Prévoir des ventes sur les 200 magasins desservis.',effect:'Le nombre de magasins desservis décrit la couverture logistique, pas la distribution commerciale acquise.'},{t:'Retenir les 80 magasins préconisés comme autant de commandes garanties.',effect:'Une préconisation n’impose pas nécessairement les commandes : le mode d’activation et la liberté des magasins doivent être vérifiés.'},{t:'Distinguer magasins desservis, ciblés, actifs et rotations observées.',effect:'Cette méthode sépare potentiel, activation et ventes réelles ; elle permet une prévision plus prudente.'}]:[{t:'Planifier la production à partir de la totalité des magasins de l’enseigne.',effect:'Cela risque de surestimer les commandes et de créer des stocks inutilement immobilisés.'},{t:'Piloter les mises en place, commandes, ruptures, rotations et engagements promotionnels.',effect:'Le déploiement est suivi sur des indicateurs opérationnels et commerciaux distincts.'},{t:'Laisser les régions se déployer sans suivi pour réduire les coûts commerciaux.',effect:'L’absence d’activation et de contrôle peut laisser l’accord national sans présence effective en magasin.'}],opportunity:r==='local'?'Des retours terrain immédiats sur la rotation et le réassort.':ROUTES[r].opportunity,attention:r==='local'?'Les petits volumes et les livraisons dispersées augmentent le coût de service.':r==='regional'?'La distribution régionale dépend de la préconisation, des commandes et des mises en place, pas du seul parc desservi.':'La couverture négociée doit être convertie en distribution effective.',preco:r==='local'?'Caler fréquence, franco ou minimum de commande, puis mesurer les rotations.':r==='regional'?'Suivre les magasins actifs et distinguer les commandes libres des mises en place poussées.':'Mettre en place une revue de lancement avec indicateurs de distribution et rentabilité.',score:'Crédibilité fournisseur · Pilotage & stratégie',passport:'DURER — Piloter l’implantation, la disponibilité, la rotation et la qualité de service.'}
];}
// Moteur pédagogique explicite. L'appréciation croise décision, circuit et prérequis déclarés.
// Aucune notation CAP SCORE, aucun diagnostic de conformité automatisé.
const GRADES={positive:{label:'Situation adaptée',icon:'✓',intro:'Votre situation est adaptée à cette décision, sous réserve de confirmer les éléments propres au client.'},neutral:{label:'Point de vigilance',icon:'◇',intro:'Décision envisageable, mais certains prérequis restent à vérifier avant de s’engager.'},negative:{label:'Zone de risque',icon:'!',intro:'Votre niveau de préparation déclaré ou le choix retenu expose l’entreprise à un risque commercial ou opérationnel.'}};
function evaluateDecision(idx,opt){
 const p=state.profile,r=state.route;
 let grade='positive',reasons=[],actions=[];
 const risk=(why,act)=>{grade='negative';reasons.push(why);if(act)actions.push(act)};
 const caution=(why,act)=>{if(grade!=='negative')grade='neutral';reasons.push(why);if(act)actions.push(act)};
 const good=(why)=>{reasons.push(why)};
 const cgv=p.cgv==='ready',eco=p.economics==='yes',badCgv=p.cgv==='none',badEco=p.economics==='no';
 const experienced=p.presence==='regional'||p.presence==='national';
 const platform=p.logistics==='platform'||p.logistics==='provider';
 const ambitionHigh=r==='regional'||r==='national';
 if(idx===0){
   if(opt===0){caution('La gamme complète ne démontre pas à elle seule son intérêt pour le rayon.','Définir le rôle de chaque référence et vérifier l’assortiment cible.');}
   else if(opt===1){good('L’analyse du rayon et des références concurrentes est une préparation pertinente.');}
   else {good('Un test délimité et assorti d’indicateurs permet d’étayer l’opportunité commerciale.');}
   if(ambitionHigh && p.presence==='none')caution('Vous envisagez un circuit élargi sans expérience GMS déclarée.','Prévoir une validation du potentiel et du dispositif d’exécution avant la diffusion.');
   if(r==='national' && ['0-50','50-100','100-150','150-200','200-250'].includes(p.revenue))caution('Une ambition nationale pour cette tranche de CA demande une vérification renforcée des moyens ; ce n’est pas un refus automatique.','Dimensionner les ressources et le financement du lancement.');
   if(badCgv)caution('Vos tarifs et CGV ne sont pas formalisés.','Préparer les documents commerciaux avant tout engagement.');
 }
 else if(idx===1){
   if(r==='local'){
     if(opt===0)good('Les données articles, les CGV et les modalités de livraison correspondent au processus local décrit.');
     if(opt===1)risk('S’équiper d’emblée en EDI et PIM sans exigence identifiée peut créer des coûts inutiles.','Demander au magasin ses modalités exactes de référencement et de commande.');
     if(opt===2)risk('Commencer à vendre sans formaliser le dossier accroît les risques de litiges et d’erreurs.','Finaliser les références, les conditions et le processus de commande avant le lancement.');
   }else{
     if(opt===0)good('Identifier les exigences de données, d’échanges et de livraison avant de choisir un prestataire est la bonne méthode.');
     if(opt===1)caution('Choisir un prestataire avant les spécifications peut conduire à une solution incompatible ou surdimensionnée.','Obtenir les cahiers des charges de l’enseigne.');
     if(opt===2)risk('Externaliser les flux n’exonère pas le fournisseur de la fiabilité des données ni du respect des engagements.','Nommer un responsable de la qualité du référentiel et contrôler les échanges.');
     if(!platform)caution('Votre logistique actuelle n’indique pas de dispositif plateforme ou de prestataire logistique.','Vérifier transport, palettisation, réception et coûts de la plateforme cible.');
     if(!experienced)caution('Vous n’avez pas déclaré d’expérience régionale ou nationale.','Vérifier les procédures administratives et logistiques avant le déploiement.');
   }
   if(badCgv)risk('Les CGV ne sont pas formalisées alors que le dossier de référencement doit les prendre en compte.','Formaliser les CGV et le tarif applicable.');
   else if(!cgv)caution('Vos CGV sont seulement partiellement structurées.','Valider leur complétude et leur cohérence avec les conditions proposées.');
 }
 else if(idx===2){
   if(opt===0)risk('Accepter une concession sur une simple promesse de développement expose à une dégradation de rentabilité.','Obtenir des engagements précis et chiffrer les effets de l’accord.');
   else if(opt===1)good('La descente tarifaire doit intégrer les réductions, services et assiettes effectivement convenus.');
   else if(opt===2)good('Un engagement réciproque et une estimation économique sont des bases solides de négociation.');
   if(badCgv)risk('Sans CGV formalisées, la proposition part d’un socle commercial insuffisamment défini.','Formaliser barème, CGV et conditions spécifiques.');
   else if(!cgv)caution('La formalisation partielle des CGV fragilise le chiffrage de l’accord.','Vérifier la base contractuelle et les éventuelles conditions particulières.');
   if(badEco)risk('Vous déclarez ne pas mesurer la rentabilité par client ou circuit.','Calculer contribution et coûts commerciaux/logistiques avant toute concession.');
   else if(!eco)caution('Votre calcul de rentabilité est encore partiel.','Chiffrer remises, coopération, coûts logistiques et volumes réalistes.');
   if(cgv&&eco&&opt!==0)good('CGV structurées et rentabilité suivie : les prérequis économiques déclarés soutiennent votre méthode.');
 }
 else if(idx===3){
   if(r==='local'){
     if(opt===0)risk('Livrer sans revoir le coût par commande peut dégrader durablement la marge.','Comparer frais de livraison, volumes et engagements de service.');
     if(opt===1)good('Fréquence et minimum de commande peuvent concilier qualité de service et économie logistique, avec accord du magasin.');
     if(opt===2)risk('Différer les livraisons sans délai convenu peut provoquer des ruptures.','Formaliser des délais de livraison réalistes et compatibles avec le réassort.');
     if(p.logistics==='platform')caution('Votre organisation déclarée est centrée sur la plateforme, alors que le scénario prévoit une livraison magasin.','Vérifier qu’une livraison directe ou un transporteur est disponible.');
   }else if(r==='regional'){
     if(opt===0)risk('Le parc desservi par la plateforme n’est pas un parc de magasins acheteurs.','Distinguer magasins desservis, ciblés, commandants et actifs.');
     if(opt===1)caution('La préconisation peut être limitée et n’engage pas systématiquement les magasins à commander.','Confirmer le mode de diffusion : libre, poussé ou mixte.');
     if(opt===2)good('Le suivi du parc ciblé, des commandes et des rotations fournit une base réaliste au prévisionnel.');
     if(!platform)caution('La livraison sur plateforme n’apparaît pas dans votre organisation logistique déclarée.','Vérifier transporteur, conditionnement des palettes et conditions de réception.');
   }else{
     if(opt===0)risk('Dimensionner la production sur le parc total suppose une diffusion qui n’est pas acquise.','Bâtir des prévisions sur le périmètre réellement engagé et le plan de mise en place.');
     if(opt===1)good('Le suivi des mises en place, ruptures et rotations soutient le déploiement effectif.');
     if(opt===2)risk('Un déploiement national sans suivi actif expose à une diffusion insuffisante.','Prévoir couverture terrain, reporting commercial et plan de relance.');
     if(!platform)caution('Le profil ne fait apparaître ni plateforme ni prestataire logistique.','Valider la couverture multi-sites avant de s’engager.');
     if(!experienced)caution('Vous ne déclarez pas d’expérience de déploiement national ou régional.','Privilégier une montée en puissance contractualisée et vérifiable.');
   }
   if(badEco)caution('La rentabilité par client ou circuit n’est pas mesurée.','Mettre en place le suivi du coût de service et de la contribution.');
 }
 // Une réponse méthodologiquement favorable ne supprime pas les lacunes déclarées.
 if(!reasons.length)good('La décision s’inscrit dans une logique commerciale cohérente avec les données renseignées.');
 actions=[...new Set(actions)].slice(0,4);
 return {grade,...GRADES[grade],reasons,actions,inputs:[`Circuit : ${ROUTES[r].name}`,`CGV : ${label('cgv',p.cgv)}`,`Rentabilité : ${label('economics',p.economics)}`,`Logistique : ${label('logistics',p.logistics)}`]};
}
function verdictHTML(v){return `<section class="verdict ${v.grade}" role="status"><div class="verdictTop"><span class="pill ${v.grade}">${v.icon} ${v.label}</span></div><p><b>${v.intro}</b></p><ul class="why">${v.reasons.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>${v.actions.length?`<div class="meta"><b>Actions conseillées</b><ul class="why">${v.actions.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`:''}<div class="meta">Évaluation fondée sur : ${v.inputs.map(esc).join(' · ')}. Appréciation pédagogique, hors CAP SCORE.</div></section>`;}
function scenes(){return sceneData();}
function renderDecision(){const s=scenes()[state.step],i=state.step;return `<div class="eyebrow">ÉTAPE 3 / 4 · ${s.stage} · SITUATION ${i+1}/${scenes().length}</div><h2>${s.title}</h2><span class="tag">Circuit ${ROUTES[state.route].name}</span><div class="box shade" style="margin-top:19px"><h3>Situation terrain</h3><p>${s.story}</p></div><h3>${s.question}</h3><div class="options">${s.opts.map((o,j)=>`<button class="option ${state.selected===j?'selected':''}" onclick="choose(${j})" ${state.revealed?'disabled':''}><span class="letter">${String.fromCharCode(65+j)}</span><span>${o.t}</span></button>`).join('')}</div>${state.revealed?`<div class="reveal"><div class="eyebrow">CONSÉQUENCE DU CHOIX</div><p style="margin-top:9px">${s.opts[state.selected].effect}</p>${verdictHTML(evaluateDecision(i,state.selected))}<div class="triad"><div><strong>↗ Opportunité</strong>${s.opportunity}</div><div><strong>◇ Point d’attention</strong>${s.attention}</div><div class="full"><strong>Préconisation CAP NEGO®</strong>${s.preco}</div></div><div class="learn"><div><b>CAP SCORE GMS®</b>${s.score}</div><div><b>Passeport Acheteur GMS®</b>${s.passport}</div></div></div>`:''}<div class="actions"><button class="btn secondary" onclick="previous()">← Retour</button><button class="btn gold" onclick="advance()" ${state.selected===null?'disabled':''}>${!state.revealed?'Afficher la conséquence':i===scenes().length-1?'Voir le bilan':'Situation suivante'} →</button></div>`;}
function summaryView(){const r=ROUTES[state.route],ss=scenes();const p=state.profile;return `<div class="eyebrow">ÉTAPE 4 / 4 · RESTITUTION</div><h1>Bilan de votre parcours ${r.name}</h1><p class="lead">${esc(p.name)} a exploré quatre situations représentatives de la relation GMS. Chaque décision est appréciée au regard des prérequis déclarés, sans se substituer à CAP SCORE GMS® ni à une validation de conformité.</p><div class="box shade"><h3>Vos décisions</h3><ol class="list">${state.history.map((j,i)=>`<li><b>${ss[i].stage} — ${ss[i].title}</b><div>${ss[i].opts[j].t}</div><div style="margin:5px 0"><span class="pill ${evaluateDecision(i,j).grade}">${evaluateDecision(i,j).label}</span></div></li>`).join('')}</ol></div><div class="reveal"><h3>Le regard CAP NEGO® : ${r.name}</h3><div class="triad"><div><strong>Opportunité</strong>${r.opportunity}</div><div><strong>Point d’attention</strong>${r.attention}</div><div class="full"><strong>Préconisation</strong>${r.preco}</div></div></div><div class="box"><h3>Les prérequis à sécuriser</h3>${r.docs.map((x,i)=>`<label class="check"><input type="checkbox" ${state.checks[i]?'checked':''} onchange="setCheck(${i},this.checked)"><span>${x}</span></label>`).join('')}<p class="muted small">Liste pédagogique à cocher librement ; elle ne constitue pas une attestation de conformité.</p></div><div class="learn"><div><b>CAP SCORE GMS® · Offert aux participants</b>Évaluer votre maturité réelle sur les cinq axes, à tête reposée, après le webinaire.<p style="margin-top:8px"><a href="https://score.conseil-action-performance.fr" target="_blank" rel="noopener noreferrer">Accéder à CAP SCORE</a></p></div><div><b>Passeport Acheteur GMS® · Offert aux participants</b>Conserver les repères et préparer vos documents, votre argumentaire et vos actions de suivi.</div></div><div class="actions"><button class="btn secondary" onclick="previous()">← Revoir la dernière décision</button><div style="display:flex;gap:9px;flex-wrap:wrap"><button class="btn secondary" onclick="window.print()">Imprimer / PDF</button><button class="btn gold" onclick="restart()">Recommencer ↻</button></div></div>`;}
function render(){progress();renderAside();$('main').innerHTML=state.view==='profile'?profileView():state.view==='route'?routeView():state.view==='journey'?renderDecision():summaryView();window.scrollTo(0,0);}
function goProfile(){state.view='profile';render()}function goRoute(){if(!state.profile.name.trim()){alert('Indiquez le nom de l’entreprise avant de poursuivre.');return;}state.view='route';render()}function setRoute(k){state.route=k;render()}function startJourney(){if(!state.route)return;state.view='journey';state.step=0;state.selected=null;state.revealed=false;state.history=[];state.checks={};render()}function choose(i){if(state.revealed)return;state.selected=i;render()}function advance(){if(state.selected===null)return;if(!state.revealed){state.revealed=true;render();return;}state.history[state.step]=state.selected;if(state.step===scenes().length-1){state.view='summary';render();return;}state.step++;state.selected=state.history[state.step]??null;state.revealed=false;render()}function previous(){if(state.view==='summary'){state.view='journey';state.step=scenes().length-1;state.selected=state.history[state.step];state.revealed=true;render();return;}if(state.step===0){state.view='route';render();return;}state.step--;state.selected=state.history[state.step]??null;state.revealed=true;render()}function setCheck(i,v){state.checks[i]=v}function restart(){if(!confirm('Recommencer le parcours et conserver la fiche entreprise ?'))return;state.route=null;state.step=0;state.selected=null;state.history=[];state.revealed=false;state.view='profile';state.checks={};render()}
render();
</script></body></html>
